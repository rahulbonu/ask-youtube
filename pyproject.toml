[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ytrag"
version = "1.0.0"
description = "Ask questions about any YouTube video, with answers cited back to the exact second."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }

dependencies = [
    "streamlit>=1.40",
    "python-dotenv>=1.0",
    "youtube-transcript-api>=1.0",
    "yt-dlp>=2024.10.7",
    "requests>=2.31",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "anthropic>=0.40",
    "huggingface-hub>=0.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
